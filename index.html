<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the full iPhone screen; the CSS keeps content clear of the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fish Weight Calculator</title>

  <!-- Font (falls back to the system font if it can't load) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">

  <!-- All styling lives in this one file -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <h1>Fish Weight Calculator</h1>
  <img
    class="scale-photo"
    src="assets/fish-scale.png"
    alt="Digital fishing scale resting on a weigh sling"
    width="1152"
    height="768"
  >

  <!-- ===== Unit switch: pounds & ounces or kilograms ===== -->
  <div class="seg" role="group" aria-label="Units">
    <button id="u-lb" aria-pressed="true">lb &amp; oz</button>
    <button id="u-kg" aria-pressed="false">kg</button>
  </div>

  <!-- ===== Step 1: reading from the scale (fish + sling together) ===== -->
  <section class="panel">
    <h2>Weight on the scale (fish + sling)</h2>
    <!-- Elements with class "lb" show in lb & oz mode, class "kg" in kg mode -->
    <div class="row lb">
      <label>lb<input id="glb" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
      <label>oz<input id="goz" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
    </div>
    <div class="row kg" hidden>
      <label>kg<input id="gkg" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label>
    </div>
  </section>

  <!-- ===== Step 2: choose the sling to deduct ===== -->
  <section class="panel">
    <h2>Sling</h2>

    <!-- Buttons: "Custom" plus one per saved sling (filled in by js/ui.js) -->
    <div class="chips" id="chips" role="group" aria-label="Choose sling"></div>

    <!-- Custom sling entry: shown only when "Custom" is selected -->
    <div id="custom">
      <div class="row lb">
        <label>lb<input id="slb" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
        <label>oz<input id="soz" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
      </div>
      <div class="row kg" hidden>
        <label>kg<input id="skg" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label>
      </div>
    </div>

    <!-- Weight of the chosen saved sling: shown when a saved sling is selected -->
    <p class="picked" id="picked" hidden></p>

    <button class="link" id="manage" aria-expanded="false">Edit saved slings</button>

    <!-- Sling manager: list of saved slings and the "add a sling" form -->
    <div id="mgr" hidden>
      <div id="list"></div>

      <div class="add">
        <label>Name<input id="aname" class="name" type="text" maxlength="30" placeholder="e.g. Green sling"></label>
        <div class="row lb spaced">
          <label>lb<input id="alb" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
          <label>oz<input id="aoz" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
        </div>
        <div class="row kg spaced" hidden>
          <label>kg<input id="akg" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label>
        </div>
        <button class="btn" id="save">Save sling</button>
        <p class="hint" id="msg" role="status"></p>
      </div>
    </div>
  </section>

  <!-- ===== Result: scale reading minus sling ===== -->
  <div class="result" aria-live="polite">
    <small>Fish weight</small>
    <div class="big" id="out">&ndash;</div>
    <div class="alt" id="alt">Enter the scale reading to see the result.</div>
  </div>

  <button class="clear" id="clear">Clear scale reading</button>
</main>

<!-- Scripts load in this order: each one uses the ones above it -->
<script src="js/units.js"></script>    <!-- weight conversion and formatting -->
<script src="js/storage.js"></script>  <!-- saving/loading on the device -->
<script src="js/ui.js"></script>       <!-- drawing the screen -->
<script src="js/app.js"></script>      <!-- app logic and button handlers -->
</body>
</html>
