<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fish Weight Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e4ebe7;--card:#f5f8f6;--ink:#14302a;--mute:#5b7068;--line:#c3d0c9;--accent:#1f6f5c;--on:#fff;--warn:#a23b2a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c19;--card:#182925;--ink:#e3efe9;--mute:#94aba2;--line:#2b423b;--accent:#5fc3a5;--on:#0f1c19;--warn:#f08a74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c19;--card:#182925;--ink:#e3efe9;--mute:#94aba2;--line:#2b423b;--accent:#5fc3a5;--on:#0f1c19;--warn:#f08a74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:20px 16px 32px}
main{width:100%;max-width:440px}
h1{font-size:1.5rem;font-weight:800;margin:4px 0 16px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{font-size:1rem;margin:0 0 10px;font-weight:600}
.row{display:flex;gap:10px}
label{flex:1;font-size:.85rem;color:var(--mute)}
input{display:block;width:100%;margin-top:4px;font:inherit;font-size:1.4rem;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input.name{font-size:1.1rem}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.picked{margin:0;font-size:1.1rem;font-weight:600}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:8px 0 0;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item span{flex:1;font-weight:600}
.item em{font-style:normal;color:var(--mute)}
.del{border:1px solid var(--line);background:none;color:var(--warn);font:inherit;font-weight:600;padding:6px 10px;border-radius:8px;cursor:pointer}
.add{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.btn{margin-top:12px;width:100%;border:0;background:var(--accent);color:var(--on);font:inherit;font-weight:600;padding:12px;border-radius:12px;cursor:pointer}
.result{background:var(--accent);color:var(--on);border-radius:16px;padding:22px 18px;margin-top:16px}
.result small{display:block;font-size:.9rem;opacity:.85}
.big{font-size:2.8rem;font-weight:800;line-height:1.1;margin:6px 0}
.alt{font-size:1rem;opacity:.9}
.hint{font-size:.85rem;color:var(--mute);margin:10px 2px 0}
.hint.err{color:var(--warn);font-weight:600}
.clear{margin-top:12px;width:100%;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:600;padding:12px;border-radius:12px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Fish Weight Calculator</h1>
<div class="seg" role="group" aria-label="Units">
<button id="u-lb" aria-pressed="true">lb &amp; oz</button>
<button id="u-kg" aria-pressed="false">kg</button>
</div>

<section class="panel">
<h2>Weight on the scale (fish + sling)</h2>
<div class="row lb"><label>lb<input id="glb" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
<label>oz<input id="goz" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label></div>
<div class="row kg" hidden><label>kg<input id="gkg" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label></div>
</section>

<section class="panel">
<h2>Sling</h2>
<div class="chips" id="chips" role="group" aria-label="Choose sling"></div>
<div id="custom">
<div class="row lb"><label>lb<input id="slb" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
<label>oz<input id="soz" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label></div>
<div class="row kg" hidden><label>kg<input id="skg" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label></div>
</div>
<p class="picked" id="picked" hidden></p>
<button class="link" id="manage" aria-expanded="false">Edit saved slings</button>
<div id="mgr" hidden>
<div id="list"></div>
<div class="add">
<label>Name<input id="aname" class="name" type="text" maxlength="30" placeholder="e.g. Green sling"></label>
<div class="row lb" style="margin-top:10px"><label>lb<input id="alb" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
<label>oz<input id="aoz" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label></div>
<div class="row kg" hidden style="margin-top:10px"><label>kg<input id="akg" type="number" inputmode="decimal" min="0" step="any" placeholder="0.000"></label></div>
<button class="btn" id="save">Save sling</button>
<p class="hint" id="msg" role="status"></p>
</div>
</div>
</section>

<div class="result" aria-live="polite">
<small>Fish weight</small>
<div class="big" id="out">&ndash;</div>
<div class="alt" id="alt">Enter the scale reading to see the result.</div>
</div>
<button class="clear" id="clear">Clear scale reading</button>
</main>

<script>
(function(){
var KG=0.45359237;
var $=function(id){return document.getElementById(id)};
var S={unit:'lb',sel:'custom',slings:[],c:{lb:'',oz:'',kg:''}};
function save(){try{localStorage.setItem('fishweights',JSON.stringify(S))}catch(e){}}
function load(){
try{
var d=JSON.parse(localStorage.getItem('fishweights')||'null');
if(d){S.unit=d.unit==='kg'?'kg':'lb';S.sel=d.sel||'custom';S.slings=Array.isArray(d.slings)?d.slings:[];S.c=d.c||S.c;return}
var o=JSON.parse(localStorage.getItem('sling')||'null');
if(o){S.unit=o.unit==='kg'?'kg':'lb';S.c={lb:o.slb||'',oz:o.soz||'',kg:o.skg||''}}
}catch(e){}
}
function n(id){var v=parseFloat($(id).value);return isFinite(v)&&v>0?v:0}
function has(id){return $(id).value.trim()!==''}
function lbOz(lb){
var t=Math.round(lb*16*10)/10,l=Math.floor(t/16+1e-9),o=Math.round((t-l*16)*10)/10;
if(o>=16){l++;o=0}
return l+' lb '+o+' oz';
}
function show(lb){return S.unit==='kg'?(lb*KG).toFixed(3)+' kg':lbOz(lb)}
function slingLb(){
if(S.sel==='custom')return S.unit==='kg'?n('skg')/KG:n('slb')+n('soz')/16;
for(var i=0;i<S.slings.length;i++)if(S.slings[i].id===S.sel)return S.slings[i].lb;
return 0;
}
function render(){
$('u-lb').setAttribute('aria-pressed',S.unit==='lb');
$('u-kg').setAttribute('aria-pressed',S.unit==='kg');
document.querySelectorAll('.lb').forEach(function(e){e.hidden=S.unit!=='lb'});
document.querySelectorAll('.kg').forEach(function(e){e.hidden=S.unit!=='kg'});
var ch=$('chips');ch.innerHTML='';
function chip(id,label){
var b=document.createElement('button');b.className='chip';b.textContent=label;
b.setAttribute('aria-pressed',S.sel===id);
b.onclick=function(){S.sel=id;save();render();calc()};
ch.appendChild(b);
}
chip('custom','Custom');
S.slings.forEach(function(s){chip(s.id,s.name)});
var isC=S.sel==='custom';
$('custom').hidden=!isC;
var p=$('picked');p.hidden=isC;
if(!isC)p.textContent=show(slingLb());
var l=$('list');l.innerHTML='';
if(!S.slings.length){var e=document.createElement('p');e.className='hint';e.textContent='No saved slings yet. Add one below.';l.appendChild(e)}
S.slings.forEach(function(s){
var d=document.createElement('div');d.className='item';
var nm=document.createElement('span');nm.textContent=s.name;
var w=document.createElement('em');w.textContent=show(s.lb);
var x=document.createElement('button');x.className='del';x.textContent='Delete';x.setAttribute('aria-label','Delete '+s.name);
x.onclick=function(){S.slings=S.slings.filter(function(t){return t.id!==s.id});if(S.sel===s.id)S.sel='custom';save();render();calc()};
d.appendChild(nm);d.appendChild(w);d.appendChild(x);l.appendChild(d);
});
}
function calc(){
var out=$('out'),alt=$('alt'),g;
var has_=S.unit==='lb'?(has('glb')||has('goz')):has('gkg');
if(!has_){out.textContent='\u2013';alt.textContent='Enter the scale reading to see the result.';return}
g=S.unit==='lb'?n('glb')+n('goz')/16:n('gkg')/KG;
var net=g-slingLb();
if(net<-1e-9){out.textContent='Check numbers';alt.textContent='The sling weighs more than the scale reading.';return}
if(net<0)net=0;
if(S.unit==='lb'){out.textContent=lbOz(net);alt.textContent=(Math.round(net*100)/100)+' lb  \u2022  '+(Math.round(net*KG*1000)/1000)+' kg'}
else{out.textContent=(net*KG).toFixed(3)+' kg';alt.textContent=lbOz(net)}
}
$('u-lb').onclick=function(){S.unit='lb';save();render();calc()};
$('u-kg').onclick=function(){S.unit='kg';save();render();calc()};
['glb','goz','gkg'].forEach(function(i){$(i).addEventListener('input',calc)});
['slb','soz','skg'].forEach(function(i){$(i).addEventListener('input',function(){S.c={lb:$('slb').value,oz:$('soz').value,kg:$('skg').value};save();calc()})});
$('manage').onclick=function(){var m=$('mgr');m.hidden=!m.hidden;$('manage').setAttribute('aria-expanded',!m.hidden);$('manage').textContent=m.hidden?'Edit saved slings':'Done editing'};
function doSave(){
var name=$('aname').value.trim(),msg=$('msg');
var lb=S.unit==='kg'?n('akg')/KG:n('alb')+n('aoz')/16;
msg.className='hint err';
if(!name){msg.textContent='Enter a name for the sling.';return}
if(lb<=0){msg.textContent='Enter the sling weight.';return}
var id='s'+Date.now();
S.slings.push({id:id,name:name,lb:lb});S.sel=id;
['aname','alb','aoz','akg'].forEach(function(i){$(i).value=''});
msg.className='hint';msg.textContent='Saved '+name+'.';
save();render();calc();
try{document.activeElement&&document.activeElement.blur()}catch(e){}
}
var lastSave=0;
function trySave(){var t=Date.now();if(t-lastSave<700)return;lastSave=t;doSave()}
$('save').addEventListener('pointerdown',function(e){e.preventDefault()});
$('save').addEventListener('pointerup',trySave);
$('save').addEventListener('click',trySave);
$('clear').onclick=function(){['glb','goz','gkg'].forEach(function(i){$(i).value=''});calc();(S.unit==='lb'?$('glb'):$('gkg')).focus()};
load();
$('slb').value=S.c.lb||'';$('soz').value=S.c.oz||'';$('skg').value=S.c.kg||'';
render();calc();
})();
</script>
</body>
</html>
